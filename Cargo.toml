[workspace]
resolver = "3"
members = ["rustdv_utils", "rtl/gecko/test", "rtl/mem/test", "rtl/stream/test"]

[workspace.dependencies]
rustdv_utils = { path = "rustdv_utils" }

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[workspace.lints.clippy]
into_iter_on_ref = "allow"
match_like_matches_macro = "allow"
