[workspace]
resolver = "3"
members = [
    "rustdv_utils",
    "rtl/gecko/test",
    "rtl/gecko/test_random",
    "rtl/mem/test",
    "rtl/stream/test",
]

[workspace.dependencies]
indiscriminant = { version = "0.5.0", features = ["biguint"] }
num-bigint = "0.5.1"
rustdv = { git = "https://github.com/dagronlund/rustdv.git", branch = "improvement/fix-clippy-lints" }
rustdv-vpi-stubs = { git = "https://github.com/dagronlund/rustdv.git", branch = "improvement/fix-clippy-lints" }
rustdv_utils = { path = "rustdv_utils" }

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[workspace.lints.clippy]
into_iter_on_ref = "allow"
match_like_matches_macro = "allow"
